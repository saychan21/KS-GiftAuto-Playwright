name: Gift Redeem Bot

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 실행
  workflow_dispatch:

concurrency:
  group: gift-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Run Bot
        run: python bot.py

      # 📸 스크린샷 업로드
      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      # 🧾 used_pairs 업로드 (🔥 핵심)
      - name: Upload Used Pairs
        uses: actions/upload-artifact@v4
        with:
          name: used-pairs
          path: used_pairs.txt

      # 💾 used_pairs Git 저장 (🔥 핵심)
      - name: Commit used pairs
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add used_pairs.txt
          git commit -m "update used pairs" || echo "no changes"
          git push
